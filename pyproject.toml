[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-ocr"
version = "0.2.0"
description = "使用 Python 调用微信本地 OCR 服务 (Windows / Linux / macOS, 微信 4.x 协议)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "protobuf>=7.36.1",
]

[project.optional-dependencies]
# 打码功能 (wechat_ocr.mosaic) 需要 Pillow
mosaic = ["pillow>=9.0"]

[tool.setuptools]
packages = ["wechat_ocr"]
