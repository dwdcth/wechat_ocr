syntax = "proto3";
package wx4;
import "ocr_common.proto";

message OCRSupportMessage {
	optional bool supported = 1;
}

message ReqType {
	optional bool t1 = 1;
	optional bool t2 = 2;
	optional bool t3 = 3;
}

message ParseOCRReqMessage {
	optional uint64 task_id = 1;
	optional string pic_path = 2;
	optional uint32 xx3 = 3;      // 死字段: 处理器不读取
	optional uint32 xx4 = 4;      // 死字段: 处理器不读取
	optional bytes pic_data = 5;  // 死字段: 处理器不读取 (见下)
	optional ReqType rt = 6;
}

// pic_data/xx3/xx4 逆向结论 (libwxocr.so 4.1.13, IDA 反编译 10010 处理器):
//   处理器流程 = ParseFromArray → 仅提取 pic_path → open(path,33) →
//   size<0 → err=4; 短读 → err=5; 成功 → 解码入 OCR 管线。
//   pic_data 从未被访问: 带路径时填了也被无视 (实测 path=A/data=B 返回 A);
//   无路径时 open 失败直接 err=4。微信自身截图 OCR 亦无 bytes 后门。
//   bytes 需求走 DoOCRTaskShared (零拷贝 Shared 通路, 见下) 或
//   DoOCRTaskData (临时文件; Linux /tmp 为 tmpfs, 等效内存传送)。

// 零拷贝通路 (逆向微信主程序发送方 + wxocr 处理器, 4.1.13 实测):
//   method = kMMShared(4), request_id = 10018 (REQ_OCR_SHARED)
//   request 缓冲区 = RGBA8888 原始像素 (width*height*4)
//   attach  缓冲区 = 本消息 (手写 pb, 见 ocr_manager.shared_ocr_meta_pb)
//   响应仍是 10011 ParseOCRRespMessage, task_id 恒为 0
message ParseOCRReqSharedMessage {
	optional string pic_path = 1;   // 可空 (实测留空)
	optional uint32 width = 2;      // 图片宽 (像素)
	optional uint32 height = 3;     // 图片高 (像素)
	optional ReqType rt = 4;        // t1=t2=true, 同路径版
}

message QRPoint {
	optional float x = 1;
	optional float y = 2;
}

message QRCorners {
	optional QRPoint topleft = 1;
	optional QRPoint topright = 2;
	optional QRPoint bottomright = 3;
	optional QRPoint bottomleft = 4;
}

message QRCodeResult {
	optional QRCorners corners = 1;
	optional string text = 2;         // 二维码解码内容 (URL/文本)
	optional uint32 type = 3;         // 码类型 (实测 QR_CODE = 19)
	optional uint32 unknown4 = 4;
}

message QRResultInfo {
	repeated QRCodeResult results = 1;
}

message OCRResultInfo {
	repeated ocr_common.OCRResultLine lines = 3;
	optional uint32 img_width = 4;
	optional uint32 img_height = 5;
	optional string cpu_report = 6;
	optional uint64 time_used = 7;
}

message ParseOCRRespMessage {
	optional uint64 task_id = 1;
	optional int32 err_code = 2;
	optional OCRResultInfo res = 3;
	optional ReqType rt = 4;
	optional QRResultInfo qrcode = 5; // 二维码识别结果 (含角点坐标与解码文本)
	optional bytes mmfg = 6;          // 含义未确认, 常规调用为空
}
