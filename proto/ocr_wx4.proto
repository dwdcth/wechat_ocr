syntax = "proto3";
package wx4;
import "ocr_common.proto";

message OCRSupportMessage {
	optional bool supported = 1;
}

message ReqType {
	optional bool t1 = 1;
	optional bool t2 = 2;
	optional bool t3 = 3;
}

message ParseOCRReqMessage {
	optional uint64 task_id = 1;
	optional string pic_path = 2;
	optional uint32 xx3 = 3;
	optional uint32 xx4 = 4;
	optional bytes pic_data = 5;      // 实测: 单独使用会返回 err=4, 需未知伴随字段, 请用 pic_path
	optional ReqType rt = 6;
}

message QRPoint {
	optional float x = 1;
	optional float y = 2;
}

message QRCorners {
	optional QRPoint topleft = 1;
	optional QRPoint topright = 2;
	optional QRPoint bottomright = 3;
	optional QRPoint bottomleft = 4;
}

message QRCodeResult {
	optional QRCorners corners = 1;
	optional string text = 2;         // 二维码解码内容 (URL/文本)
	optional uint32 type = 3;         // 码类型 (实测 QR_CODE = 19)
	optional uint32 unknown4 = 4;
}

message QRResultInfo {
	repeated QRCodeResult results = 1;
}

message OCRResultInfo {
	repeated ocr_common.OCRResultLine lines = 3;
	optional uint32 img_width = 4;
	optional uint32 img_height = 5;
	optional string cpu_report = 6;
	optional uint64 time_used = 7;
}

message ParseOCRRespMessage {
	optional uint64 task_id = 1;
	optional int32 err_code = 2;
	optional OCRResultInfo res = 3;
	optional ReqType rt = 4;
	optional QRResultInfo qrcode = 5; // 二维码识别结果 (含角点坐标与解码文本)
	optional bytes mmfg = 6;          // 含义未确认, 常规调用为空
}
